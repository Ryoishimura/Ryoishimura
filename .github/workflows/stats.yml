   name: Generate stats cards

   on:
     schedule:
       - cron: "0 15 * * *" # 毎日 0:00 JST
     workflow_dispatch:

   permissions:
     contents: write

   jobs:
     generate:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4

         - uses: stats-organization/github-readme-stats-action@v2
           with:
             card: stats
             options: show_icons=true&theme=tokyonight&hide_border=true
             path: profile/stats.svg
             token: ${{ secrets.GITHUB_TOKEN }}

         - uses: stats-organization/github-readme-stats-action@v2
           with:
             card: top-langs
             options: layout=compact&langs_count=8&theme=tokyonight&hide_border=true
             path: profile/top-langs.svg
             token: ${{ secrets.GITHUB_TOKEN }}

         - name: Commit cards
           run: |
             git config user.name "github-actions[bot]"
             git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
             git add profile/*.svg
             git commit -m "Update stats cards" || exit 0
             git push
